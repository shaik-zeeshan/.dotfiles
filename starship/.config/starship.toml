# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"
# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10
# Disable the blank line at the start of the prompt
add_newline = false

# Optional: Custom format to show specific env vars in prompt
# Uncomment and modify as needed
format = """
$all\
$C1\
$line_break\
$character"""

# Color palette using environment variables
palette = "dynamic"

[palettes.dynamic]
c1 = "#FFB366"  # Bright warm orange - good for text
c2 = "#FF8F65"  # Medium orange - readable
c3 = "#FF6B4A"  # Coral red - bright enough for text
c4 = "#E85A4F"  # Deep red - good contrast
c5 = "#2D3748"  # Dark blue-gray - good for backgrounds/borders
c6 = "#4A5568"  # Medium gray - readable
c7 = "#718096"  # Light gray - good for secondary text
c8 = "#A0AEC0"  # Lighter gray - subtle but visible
c9 = "#CBD5E0"  # Very light gray - high contrast
c10 = "#F7FAFC" # Near white - maximum contrast


# Environment variable modules for color theme info
# [env_var.THEME_NAME]
# variable = "CURRENT_THEME"
# default = "sunset-mountain"
# style = "c3"
#format = "[$env_value](italic $style)"

# [env_var.COLOR_MODE]
# variable = "COLOR_MODE"
# default = "auto"
# style = "c7"
#format = "[$env_value]($style)"

[fill]
symbol = " "

[character]
success_symbol = "[➜](bold c1)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold c2"
read_only = " 󰌾"
read_only_style = "c5"
truncation_length = 1
truncate_to_repo = false

[git_branch]
symbol = " "
style = "c4"

[git_status]
style = "c6"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
staged = "[++\\($count\\)](c7)"

[git_commit]
tag_symbol = "  "
style = "c8"

